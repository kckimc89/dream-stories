<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1000" height="570" rx="0" fill="#f6f4e9" stroke="none" stroke-width="2"/><rect x="24" y="24" width="952" height="94" rx="18" fill="#163e58" stroke="none" stroke-width="2"/><text x="48" y="66" font-size="36" fill="white" font-weight="700" text-anchor="start">낮과 저녁의 하늘색</text><text x="48" y="98" font-size="20" fill="#d6e9ef" font-weight="400" text-anchor="start">태양까지의 거리 차이가 아니라 대기 속 경로 차이</text><rect x="40" y="145" width="920" height="190" rx="18" fill="#d7ebfa" stroke="none" stroke-width="2"/><text x="62" y="182" font-size="27" fill="#174e69" font-weight="700" text-anchor="start">낮 · 파란 하늘</text><text x="62" y="221" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">태양빛이 비교적 짧은 대기 경로를 지나와요.</text><text x="62" y="253" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">짧은 파장의 파란빛이 여러 방향으로 산란해 눈에 들어와요.</text><rect x="40" y="355" width="920" height="190" rx="18" fill="#f9dec6" stroke="none" stroke-width="2"/><text x="62" y="392" font-size="27" fill="#174e69" font-weight="700" text-anchor="start">저녁 · 붉은 노을</text><text x="62" y="431" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">태양이 지평선 가까이 있어 대기 통과 경로가 길어요.</text><text x="62" y="463" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">파란빛이 많이 흩어지고 붉은빛과 주황빛이 상대적으로 남아요.</text></svg>