<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="805" viewBox="0 0 1000 805"><rect width="100%" height="100%" rx="24" fill="#f4f8f5"/><g font-family="sans-serif" fill="#17364c"><rect x="24" y="24" width="952" height="105" rx="20" fill="#183d56"/><text x="50" y="70" font-size="39" font-weight="bold" fill="white">씨앗에서 다시 씨앗으로</text><text x="50" y="106" font-size="25" fill="#d6ebed">강낭콩의 발아와 한살이</text><rect x="38" y="150" width="924" height="130" rx="17" fill="#e1eff7"/><circle cx="85" cy="187" r="25" fill="#24536c"/><text x="85" y="196" text-anchor="middle" font-size="27" fill="white">1</text><text x="126" y="193" font-size="32" font-weight="bold">물 흡수와 발아</text><text x="126" y="232" font-size="25">물, 산소, 적절한 온도가 필요해요.</text><path d="M500 283v17m-7 -8 7 8 7 -8" fill="none" stroke="#24536c" stroke-width="4"/><rect x="38" y="305" width="924" height="130" rx="17" fill="#e6f1d9"/><circle cx="85" cy="342" r="25" fill="#24536c"/><text x="85" y="351" text-anchor="middle" font-size="27" fill="white">2</text><text x="126" y="348" font-size="32" font-weight="bold">뿌리와 어린 줄기</text><text x="126" y="387" font-size="25">떡잎에 저장된 양분으로 처음 성장해요.</text><path d="M500 438v17m-7 -8 7 8 7 -8" fill="none" stroke="#24536c" stroke-width="4"/><rect x="38" y="460" width="924" height="130" rx="17" fill="#fff0d2"/><circle cx="85" cy="497" r="25" fill="#24536c"/><text x="85" y="506" text-anchor="middle" font-size="27" fill="white">3</text><text x="126" y="503" font-size="32" font-weight="bold">본잎의 광합성</text><text x="126" y="542" font-size="25">빛 에너지로 물과 이산화탄소에서 당을 만들어요.</text><path d="M500 593v17m-7 -8 7 8 7 -8" fill="none" stroke="#24536c" stroke-width="4"/><rect x="38" y="615" width="924" height="130" rx="17" fill="#f2e5f5"/><circle cx="85" cy="652" r="25" fill="#24536c"/><text x="85" y="661" text-anchor="middle" font-size="27" fill="white">4</text><text x="126" y="658" font-size="32" font-weight="bold">꽃, 열매, 새로운 씨앗</text><text x="126" y="697" font-size="25">꽃가루받이와 수정 후 씨앗이 자라요.</text></g></svg>