<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#287aa0"/></marker></defs><rect width="960" height="720" rx="22" fill="#f3f8fc"/><text x="35" y="54" font-size="36" fill="#243b53" font-weight="bold" text-anchor="start">단풍의 색깔은 어디에서 올까요?</text><text x="36" y="92" font-size="23" fill="#243b53" font-weight="normal" text-anchor="start">잎 속 색소의 변화</text><rect x="45" y="135" width="270" height="280" rx="14" fill="#e5edf2"/><path d="M180 350 Q65 270 180 175 Q295 270 180 350Z" fill="#42985a"/><path d="M180 342 L180 200" stroke="#f2e7a8" stroke-width="3" fill="none"/><text x="180" y="380" font-size="26" fill="#243b53" font-weight="normal" text-anchor="middle">엽록소</text><text x="180" y="405" font-size="19" fill="#243b53" font-weight="normal" text-anchor="middle">빛 흡수·광합성</text><rect x="345" y="135" width="270" height="280" rx="14" fill="#e5edf2"/><path d="M480 350 Q365 270 480 175 Q595 270 480 350Z" fill="#e4ba38"/><path d="M480 342 L480 200" stroke="#f2e7a8" stroke-width="3" fill="none"/><text x="480" y="380" font-size="26" fill="#243b53" font-weight="normal" text-anchor="middle">카로티노이드</text><text x="480" y="405" font-size="19" fill="#243b53" font-weight="normal" text-anchor="middle">노랑·주황 색소</text><rect x="645" y="135" width="270" height="280" rx="14" fill="#e5edf2"/><path d="M780 350 Q665 270 780 175 Q895 270 780 350Z" fill="#c74a52"/><path d="M780 342 L780 200" stroke="#f2e7a8" stroke-width="3" fill="none"/><text x="780" y="380" font-size="26" fill="#243b53" font-weight="normal" text-anchor="middle">안토시아닌</text><text x="780" y="405" font-size="19" fill="#243b53" font-weight="normal" text-anchor="middle">일부 잎에서 새로 생성</text><text x="40" y="470" font-size="26" fill="#243b53" font-weight="bold" text-anchor="start">가을: 낮이 짧아지고 잎의 엽록소가 분해됩니다.</text><text x="40" y="515" font-size="22" fill="#243b53" font-weight="normal" text-anchor="start">노란 색소가 드러나고, 일부 잎에서는 당을 이용해 붉은 색소를 만듭니다.</text><text x="40" y="560" font-size="23" fill="#243b53" font-weight="normal" text-anchor="start">햇빛과 서늘한 밤은 일부 수종에서 붉은색 형성에 도움이 됩니다.</text><text x="40" y="620" font-size="24" fill="#243b53" font-weight="normal" text-anchor="start">나무 종류와 날씨에 따라 단풍의 색과 시기는 달라집니다.</text></svg>