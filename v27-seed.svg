<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1000" height="610" rx="0" fill="#f6f4e9" stroke="none" stroke-width="2"/><rect x="24" y="24" width="952" height="94" rx="18" fill="#163e58" stroke="none" stroke-width="2"/><text x="48" y="66" font-size="36" fill="white" font-weight="700" text-anchor="start">씨앗에서 새로운 씨앗까지</text><text x="48" y="98" font-size="20" fill="#d6e9ef" font-weight="400" text-anchor="start">강낭콩의 한살이 · 생명은 어떻게 이어질까요?</text><rect x="40" y="145" width="450" height="205" rx="18" fill="#f3e7cb" stroke="none" stroke-width="2"/><text x="62" y="182" font-size="27" fill="#174e69" font-weight="700" text-anchor="start">씨앗</text><text x="62" y="221" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">배: 어린 식물</text><text x="62" y="253" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">떡잎: 초기 양분 저장</text><rect x="505" y="145" width="450" height="205" rx="18" fill="#e2ebd5" stroke="none" stroke-width="2"/><text x="527" y="182" font-size="27" fill="#174e69" font-weight="700" text-anchor="start">발아</text><text x="527" y="221" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">물 · 산소 · 알맞은 온도</text><text x="527" y="253" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">뿌리가 먼저 나오는 경우가 많아요.</text><rect x="40" y="370" width="450" height="205" rx="18" fill="#d6ebd4" stroke="none" stroke-width="2"/><text x="62" y="407" font-size="27" fill="#174e69" font-weight="700" text-anchor="start">성장</text><text x="62" y="446" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">뿌리: 물과 무기 양분 흡수</text><text x="62" y="478" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">잎: 빛을 이용한 광합성</text><rect x="5