<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-label="무지개의 작은 프리즘"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f0f7fb"/><stop offset="1" stop-color="#fffdf5"/></linearGradient><marker id="arr" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" viewBox="0 0 9 9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#355c76"/></marker><marker id="red" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" viewBox="0 0 9 9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#c54c50"/></marker><marker id="blue" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" viewBox="0 0 9 9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#3679b0"/></marker></defs><rect width="1200" height="860" rx="24" fill="url(#bg)"/><g font-family="'Apple SD Gothic Neo','NanumGothic','Malgun Gothic','UnDotum',sans-serif" fill="#203c51"><text x="60" y="72" font-size="43" font-weight="bold">무지개의 작은 프리즘</text><text x="60" y="116" font-size="24" fill="#567080">물방울 하나를 크게 확대해 본 빛의 여행</text><path d="M60 143H1140" stroke="#c2d7df" stroke-width="2"/><rect x="50" y="167" width="1100" height="620" rx="22" fill="#fff" stroke="#c5d9e2" stroke-width="2"/><text x="600" y="208" font-size="25" text-anchor="middle" fill="#203c51" font-weight="bold">물방울에 들어간 빛은 굴절하고, 안에서 반사된 뒤 다시 굴절해요.</text><circle cx="620" cy="474" r="222" fill="#d7eef7" stroke="#75b3d0" stroke-width="4"/><circle cx="580" cy="400" r="16" fill="#ffffff" stroke="none" stroke-width="1"/><circle cx="550" cy="430" r="9" fill="#ffffff" stroke="none" stroke-width="1"/><path d="M100 283.7L505.7 283.7" stroke="#d9ae37" stroke-width="8" fill="none" marker-end="url(#arr)"/><text x="100" y="260.7" font-size="24" font-weight="bold">햇빛 (여러 색의 빛)</text><path d="M505.7 283.7L827.0 393.8L663.7 691.6L629.3 723.0" fill="none" stroke="#cb4646" stroke-width="5" stroke-linecap="round"/><path d="M505.7 283.7L827.6 395.3L660.5 692.3L625.8 723.0" fill="none" stroke="#e69b35" stroke-width="5" stroke-linecap="round"/><path d="M505.7 283.7L828.2 396.9L657.2 692.9L622.1 723.0" fill="none" stroke="#3d75cb" stroke-width="5" stroke-linecap="round"/><text x="92" y="350" font-size="24">1. 들어갈 때 굴절</text><text x="870" y="424" font-size="24">2. 내부 반사</text><text x="870" y="458" font-size="20">(일부 빛)</text><text x="690" y="710" font-size="24">3. 나올 때 굴절</text><path d="M95 635H135" stroke="#cb4646" stroke-width="5"/><text x="150" y="643" font-size="22">붉은빛</text><path d="M95 675H135" stroke="#3d75cb" stroke-width="5"/><text x="150" y="683" font-size="22">푸른빛</text><text x="86" y="757" font-size="23" text-anchor="start" fill="#203c51" font-weight="normal">색마다 굴절 정도가 조금씩 달라져요. 태양을 등지고 무지개를 관찰해요.</text><text x="60" y="829" font-size="20" fill="#567080">꿈나라 동화책 · 과학 원리 모식도 (크기와 거리는 실제 비율이 아님)</text></g></svg>