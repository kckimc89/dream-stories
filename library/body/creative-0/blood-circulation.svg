<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-label="피는 어디로 여행할까?"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f0f7fb"/><stop offset="1" stop-color="#fffdf5"/></linearGradient><marker id="arr" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" viewBox="0 0 9 9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#355c76"/></marker><marker id="red" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" viewBox="0 0 9 9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#c54c50"/></marker><marker id="blue" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" viewBox="0 0 9 9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#3679b0"/></marker></defs><rect width="1200" height="860" rx="24" fill="url(#bg)"/><g font-family="'Apple SD Gothic Neo','NanumGothic','Malgun Gothic','UnDotum',sans-serif" fill="#203c51"><text x="60" y="72" font-size="43" font-weight="bold">피는 어디로 여행할까?</text><text x="60" y="116" font-size="24" fill="#567080">폐순환과 온몸순환 · 혈액이 흐르는 방향</text><path d="M60 143H1140" stroke="#c2d7df" stroke-width="2"/><rect x="50" y="165" width="1100" height="625" rx="22" fill="#fff" stroke="#c5d9e2" stroke-width="2"/><text x="600" y="204" font-size="27" text-anchor="middle" fill="#203c51" font-weight="bold">폐에서 산소를 받고, 온몸에서 산소를 건네는 두 순환</text><g fill="#f4b2b6" stroke="#b9757f" stroke-width="3"><path d="M587 245C550 215 495 240 480 291C467 332 478 372 515 376Q565 377 587 337Z"/><path d="M613 245C650 215 705 240 720 291C733 332 722 372 685 376Q635 377 613 337Z"/></g><path d="M600 221L600 300" stroke="#728f8a" stroke-width="10" fill="none"/><path d="M600 290L549 325" stroke="#728f8a" stroke-width="7" fill="none"/><path d="M600 290L651 325" stroke="#728f8a" stroke-width="7" fill="none"/><text x="600" y="397" font-size="23" text-anchor="middle" fill="#203c51" font-weight="normal">폐 · 산소는 피로, 이산화탄소는 공기로</text><rect x="425" y="458" width="350" height="155" rx="22" fill="#fff2ee" stroke="#d7aaaf" stroke-width="2"/><rect x="445" y="478" width="150" height="108" rx="13" fill="#e3effa" stroke="#739ac3" stroke-width="2"/><rect x="605" y="478" width="150" height="108" rx="13" fill="#ffe3e0" stroke="#d78b89" stroke-width="2"/><text x="520" y="512" font-size="23" text-anchor="middle" fill="#203c51" font-weight="bold">오른쪽 심장</text><text x="520" y="552" font-size="20" text-anchor="middle" fill="#203c51" font-weight="normal">산소 적은 피</text><text x="680" y="512" font-size="23" text-anchor="middle" fill="#203c51" font-weight="bold">왼쪽 심장</text><text x="680" y="552" font-size="20" text-anchor="middle" fill="#203c51" font-weight="normal">산소 많은 피</text><path d="M500 478C380 440 365 300 465 300" fill="none" stroke="#3679b0" stroke-width="10" stroke-linecap="round" marker-end="url(#blue)"/><path d="M735 300C835 300 820 440 700 478" fill="none" stroke="#c54c50" stroke-width="10" stroke-linecap="round" marker-end="url(#red)"/><text x="284" y="332" font-size="24" text-anchor="middle" fill="#3679b0" font-weight="bold">폐동맥</text><text x="910" y="332" font-size="24" text-anchor="middle" fill="#c54c50" font-weight="bold">폐정맥</text><rect x="460" y="690" width="280" height="72" rx="16" fill="#f3eadb" stroke="#d4b99d" stroke-width="2"/><text x="600" y="735" font-size="27" text-anchor="middle" fill="#203c51" font-weight="bold">온몸의 세포</text><path d="M720 587C870 605 878 726 755 726" fill="none" stroke="#c54c50" stroke-width="10" stroke-linecap="round" marker-end="url(#red)"/><path d="M445 726C320 726 330 605 480 587" fill="none" stroke="#3679b0" stroke-width="10" stroke-linecap="round" marker-end="url(#blue)"/><text x="917" y="642" font-size="24" text-anchor="middle" fill="#c54c50" font-weight="bold">대동맥</text><text x="280" y="642" font-size="24" text-anchor="middle" fill="#3679b0" font-weight="bold">대정맥</text><text x="83" y="725" font-size="20" text-anchor="start" fill="#3679b0" font-weight="normal">파랑: 산소가 적은 피</text><text x="83" y="757" font-size="20" text-anchor="start" fill="#c54c50" font-weight="normal">빨강: 산소가 많은 피</text><text x="820" y="773" font-size="19" text-anchor="start" fill="#203c51" font-weight="normal">실제 피는 모두 붉은색이에요.</text><text x="60" y="829" font-size="20" fill="#567080">꿈나라 동화책 · 과학 원리 모식도 (크기와 거리는 실제 비율이 아님)</text></g></svg>