<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="805" viewBox="0 0 1000 805"><rect width="100%" height="100%" rx="24" fill="#f4f8f5"/><g font-family="sans-serif" fill="#17364c"><rect x="24" y="24" width="952" height="105" rx="20" fill="#183d56"/><text x="50" y="70" font-size="39" font-weight="bold" fill="white">개미의 냄새 길</text><text x="50" y="106" font-size="25" fill="#d6ebed">페로몬을 이용하는 개미의 대표적인 행동</text><rect x="38" y="150" width="924" height="130" rx="17" fill="#e1eff7"/><circle cx="85" cy="187" r="25" fill="#24536c"/><text x="85" y="196" text-anchor="middle" font-size="27" fill="white">1</text><text x="126" y="193" font-size="32" font-weight="bold">먹이 발견</text><text x="126" y="232" font-size="25">탐색하던 일개미가 먹이를 찾아요.</text><path d="M500 283v17m-7 -8 7 8 7 -8" fill="none" stroke="#24536c" stroke-width="4"/><rect x="38" y="305" width="924" height="130" rx="17" fill="#e6f1d9"/><circle cx="85" cy="342" r="25" fill="#24536c"/><text x="85" y="351" text-anchor="middle" font-size="27" fill="white">2</text><text x="126" y="348" font-size="32" font-weight="bold">귀가하며 신호 남기기</text><text x="126" y="387" font-size="25">길에 화학 물질을 남겨 친구가 따라올 수 있게 해요.</text><path d="M500 438v17m-7 -8 7 8 7 -8" fill="none" stroke="#24536c" stroke-width="4"/><rect x="38" y="460" width="924" height="130" rx="17" fill="#fff0d2"/><circle cx="85" cy="497" r="25" fill="#24536c"/><text x="85" y="506" text-anchor="middle" font-size="27" fill="white">3</text><text x="126" y="503" font-size="32" font-weight="bold">더듬이로 감지</text><text x="126" y="542" font-size="25">친구들은 냄새 흔적과 자신이 기억한 정보를 이용해요.</text><path d="M500 593v17m-7 -8 7 8 7 -8" fill="none" stroke="#24536c" stroke-width="4"/><rect x="38" y="615" width="924" height="130" rx="17" fill="#f2e5f5"/><circle cx="85" cy="652" r="25" fill="#24536c"/><text x="85" y="661" text-anchor="middle" font-size="27" fill="white">4</text><text x="126" y="658" font-size="32" font-weight="bold">신호의 강화와 소멸</text><text x="126" y="697" font-size="25">자주 지나는 길은 강해지고 사용하지 않는 길은 약해져요.</text></g></svg>