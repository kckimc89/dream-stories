<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1000" height="750" rx="0" fill="#f6f4e9" stroke="none" stroke-width="2"/><rect x="24" y="24" width="952" height="94" rx="18" fill="#163e58" stroke="none" stroke-width="2"/><text x="48" y="66" font-size="36" fill="white" font-weight="700" text-anchor="start">김밥은 몸속에서 어떻게 소화될까요?</text><text x="48" y="98" font-size="20" fill="#d6e9ef" font-weight="400" text-anchor="start">음식이 지나가는 순서 · 입에서 항문까지</text><rect x="35" y="145" width="300" height="180" rx="18" fill="#f7e3d5" stroke="none" stroke-width="2"/><text x="57" y="182" font-size="27" fill="#174e69" font-weight="700" text-anchor="start">입</text><text x="57" y="221" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">씹기 + 침</text><text x="57" y="253" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">녹말 소화 시작</text><path d="M335 235 L350 235" stroke="#27718e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="350" y="145" width="300" height="180" rx="18" fill="#f4e9d0" stroke="none" stroke-width="2"/><text x="372" y="182" font-size="27" fill="#174e69" font-weight="700" text-anchor="start">식도</text><text x="372" y="221" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">근육의 연동운동</text><text x="372" y="253" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">음식을 위로 이동</text><path d="M650 235 L665 235" stroke="#27718e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="665" y="145" width="300" height="180" rx="18" fill="#e1edf2" stroke="none" stroke-width="2"/><text x="687" y="182" font-size="27" fill="#174e69" font-weight="700" text-anchor="start">위</text><text x="687" y="221" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">위산 + 펩신</text><text x="687" y="253" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">단백질 소화 시작</text><rect x="35" y="355" width="300" height="180" rx="18" fill="#f7e3d5" stroke="none" stroke-width="2"/><text x="57" y="392" font-size="27" fill="#174e69" font-weight="700" text-anchor="start">작은창자</text><text x="57" y="431" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">담즙 + 이자액 등</text><text x="57" y="463" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">대부분 소화·흡수</text><path d="M335 445 L350 445" stroke="#27718e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="350" y="355" width="300" height="180" rx="18" fill="#f4e9d0" stroke="none" stroke-width="2"/><text x="372" y="392" font-size="27" fill="#174e69" font-weight="700" text-anchor="start">큰창자</text><text x="372" y="431" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">물과 전해질 흡수</text><text x="372" y="463" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">장내 미생물 활동</text><path d="M650 445 L665 445" stroke="#27718e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="665" y="355" width="300" height="180" rx="18" fill="#e1edf2" stroke="none" stroke-width="2"/><text x="687" y="392" font-size="27" fill="#174e69" font-weight="700" text-anchor="start">직장·항문</text><text x="687" y="431" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">남은 찌꺼기</text><text x="687" y="463" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">몸 밖으로 배출</text><rect x="35" y="575" width="930" height="145" rx="18" fill="#e5f0f1" stroke="none" stroke-width="2"/><text x="57" y="612" font-size="27" fill="#174e69" font-weight="700" text-anchor="start">도움을 주는 기관</text><text x="57" y="651" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">간: 담즙 생성 · 쓸개: 담즙 저장 및 농축</text><text x="57" y="683" font-size="23" fill="#17334b" font-weight="400" text-a