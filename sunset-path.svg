<svg xmlns="http://www.w3.org/2000/svg" width="800" height="635" viewBox="0 0 800 635" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif"><defs><radialGradient id="earth" cx="35%" cy="30%"><stop stop-color="#a4d9f1"/><stop offset="1" stop-color="#236aa4"/></radialGradient><radialGradient id="sun"><stop stop-color="#fff7ae"/><stop offset="1" stop-color="#f9a52b"/></radialGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 3L0 6Z" fill="context-stroke"/></marker></defs><rect width="800" height="635" rx="16" fill="#f9f5e9"/><text x="400" y="38" font-size="29" fill="#243449" text-anchor="middle" font-weight="bold">낮과 저녁, 대기 속 햇빛의 여행</text><g transform="translate(0 60)"><rect x="20" y="0" width="760" height="252" rx="12" fill="#cce7fa"/><rect x="20" y="0" width="760" height="48" rx="12" fill="#243953"/><path d="M30 48H770" stroke="#eaf7ff" stroke-dasharray="7 5" stroke-width="2"/><text x="40" y="31" font-size="22" fill="#fff" text-anchor="start" font-weight="bold">한낮 · 해가 높아요</text><text x="765" y="67" font-size="13" fill="#3a4d61" text-anchor="end" font-weight="normal">대기의 위쪽 경계(모형)</text><path d="M20 214 Q400 210 780 214V252H20Z" fill="#729184"/><g fill="#304455"><circle cx="680" cy="190" r="10"/><path d="M680 202v24m0-17l-12 9m12-9l12 9m-12 8l-9 15m9-15l9 15" stroke="#304455" stroke-width="5" stroke-linecap="round" fill="none"/></g><path d="M680 48L670 190" stroke="#ffe582" stroke-width="7" marker-end="url(#arrow)"/><text x="515" y="83" font-size="16" fill="#2b6bb1" text-anchor="end" font-weight="normal">태양빛이 들어오는 방향</text><circle cx="677.0" cy="90.6" r="4" fill="#8da2ba"/><path d="M677.0 90.6l-31 -25m31 25l-38 20" stroke="#2874c4" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="673.5" cy="140.3" r="4" fill="#8da2ba"/><path d="M673.5 140.3l-31 -25m31 25l-38 20" stroke="#2874c4" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d