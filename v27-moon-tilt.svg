<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="655" viewBox="0 0 1000 655" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1000" height="655" rx="0" fill="#f6f4e9" stroke="none" stroke-width="2"/><rect x="24" y="24" width="952" height="94" rx="18" fill="#163e58" stroke="none" stroke-width="2"/><text x="48" y="66" font-size="36" fill="white" font-weight="700" text-anchor="start">달의 궤도는 조금 기울어져 있어요</text><text x="48" y="98" font-size="20" fill="#d6e9ef" font-weight="400" text-anchor="start">옆에서 본 두 궤도면의 모식도</text><rect x="40" y="145" width="920" height="300" rx="18" fill="#152d4b" stroke="none" stroke-width="2"/><path d="M100 300 L900 300" stroke="#e6d79c" stroke-width="4" fill="none"/><path d="M100 335 L900 265" stroke="#86cde1" stroke-width="4" fill="none"/><circle cx="500" cy="300" r="35" fill="#65a6c4" stroke="none" stroke-width="3"/><text x="760" y="235" font-size="25" fill="white" font-weight="400" text-anchor="start">달의 궤도면</text><text x="740" y="335" font-size="25" fill="white" font-weight="400" text-anchor="start">지구 공전면</text><text x="125" y="260" font-size="30" fill="white" font-weight="400" text-anchor="start">약 5°</text><rect x="40" y="470" width="920" height="160" rx="18" fill="#e5f0f1" stroke="none" stroke-width="2"/><text x="62" y="507" font-size="27" fill="#174e69" font-weight="700" text-anchor="start">왜 매달 일식과 월식이 없을까요?</text><text x="62" y="546" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">달의 궤도면은 지구의 공전면과 약 5° 기울어져 있어요.</text><text x="62" y="578" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">세 천체가 알맞게 정렬될 때만 식이 일어나요.</text></svg>