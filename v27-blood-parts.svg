<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1000" height="650" rx="0" fill="#f6f4e9" stroke="none" stroke-width="2"/><rect x="24" y="24" width="952" height="94" rx="18" fill="#163e58" stroke="none" stroke-width="2"/><text x="48" y="66" font-size="36" fill="white" font-weight="700" text-anchor="start">혈액에는 무엇이 들어 있을까요?</text><text x="48" y="98" font-size="20" fill="#d6e9ef" font-weight="400" text-anchor="start">세포와 액체 성분의 역할 비교 · 모양은 모식도</text><rect x="45" y="145" width="445" height="220" rx="18" fill="#f5d9d5" stroke="none" stroke-width="2"/><text x="67" y="182" font-size="27" fill="#174e69" font-weight="700" text-anchor="start">적혈구</text><text x="67" y="221" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">산소를 운반해요.</text><text x="67" y="253" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">가운데가 오목한 원반.</text><circle cx="400" cy="295" r="38" fill="#cb4e49" stroke="none" stroke-width="3"/><circle cx="400" cy="295" r="18" fill="#e78176" stroke="none" stroke-width="3"/><rect x="510" y="145" width="445" height="220" rx="18" fill="#dce9f6" stroke="none" stroke-width="2"/><text x="532" y="182" font-size="27" fill="#174e69" font-weight="700" text-anchor="start">백혈구</text><text x="532" y="221" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">병원체를 찾아 대응해요.</text><text x="532" y="253" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">여러 종류가 있어요.</text><circle cx="865" cy="295" r="42" fill="#f8fbff" stroke="#7198bc" stroke-width="3"/><circle cx="855" cy="289" r="18" fill="#8974b5" stroke="none" stroke-width="3"/><circle cx="879" cy="303" r="16" fill="#8974b5" stroke="none" stroke-width="3"/><rect x="45" y="385" width="