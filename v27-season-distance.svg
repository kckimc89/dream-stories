<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1000" height="720" rx="0" fill="#f6f4e9" stroke="none" stroke-width="2"/><rect x="24" y="24" width="952" height="94" rx="18" fill="#163e58" stroke="none" stroke-width="2"/><text x="48" y="66" font-size="36" fill="white" font-weight="700" text-anchor="start">태양과 지구 사이의 거리</text><text x="48" y="98" font-size="20" fill="#d6e9ef" font-weight="400" text-anchor="start">지구의 공전 궤도는 거의 원에 가까워요</text><rect x="45" y="150" width="910" height="300" rx="18" fill="#142b47" stroke="none" stroke-width="2"/><circle cx="500" cy="300" r="62" fill="#f5b840" stroke="none" stroke-width="3"/><text x="500" y="308" font-size="24" fill="#603900" font-weight="700" text-anchor="middle">태양</text><circle cx="200" cy="300" r="33" fill="#58a5c9" stroke="none" stroke-width="3"/><circle cx="810" cy="300" r="33" fill="#58a5c9" stroke="none" stroke-width="3"/><path d="M235 300 L435 300" stroke="#e7e7d6" stroke-width="3" fill="none"/><path d="M565 300 L775 300" stroke="#e7e7d6" stroke-width="3" fill="none"/><text x="200" y="222" font-size="27" fill="white" font-weight="700" text-anchor="middle">근일점 · 1월 초</text><text x="810" y="222" font-size="27" fill="white" font-weight="700" text-anchor="middle">원일점 · 7월 초</text><text x="200" y="380" font-size="23" fill="white" font-weight="400" text-anchor="middle">약 1억 4,710만 km</text><text x="810" y="380" font-size="23" fill="white" font-weight="400" text-anchor="middle">약 1억 5,210만 km</text><rect x="45" y="480" width="910" height="195" rx="18" fill="#e5f0f1" stroke="none" stroke-width="2"/><text x="67" y="517" font-size="27" fill="#174e69" font-weight="700" text-anchor="start">거리가 계절의 주된 원인은 아니에요</text><text x="67" y="556" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">북반구가 겨울일 때 지구는 오히려 태양에 조금 더 가까워요.</text><text x="67" y="588" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">남반구의 계절은 북반구와 반대예요.</text><text x="67" y="620" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">그림은 거리와 천체 크기를 실제 비율로 그리지 않았어요.</text></svg>