ircle r="32" fill="#ffe6a6"/><text x="0" y="53" font-size="17" fill="#d1deea" text-anchor="middle" font-weight="normal">5</text><text x="0" y="77" font-size="14" fill="#f1f5fb" text-anchor="middle" font-weight="bold">보름달</text></g><g transform="translate(547 689)"><circle r="32" fill="#43536b" stroke="#99b0c3"/><path d="M0 -32 A32 32 0 0 0 0 32 A22.62 32 0 0 0 0 -32Z" fill="#ffe6a6"/><text x="0" y="53" font-size="17" fill="#d1deea" text-anchor="middle" font-weight="normal">6</text><text x="0" y="77" font-size="14" fill="#f1f5fb" text-anchor="middle" font-weight="bold">기우는 달</text></g><g transform="translate(645 689)"><circle r="32" fill="#43536b" stroke="#99b0c3"/><path d="M0 -32 A32 32 0 0 0 0 32 L0 -32Z" fill="#ffe6a6"/><text x="0" y="53" font-size="17" fill="#d1deea" text-anchor="middle" font-weight="normal">7</text><text x="0" y="77" font-size="14" fill="#f1f5fb" text-anchor="middle" font-weight="bold">하현달</text></g><g transform="translate(743 689)"><circle r="32" fill="#43536b" stroke="#99b0c3"/><path d="M0 -32 A32 32 0 0 0 0 32 A22.62 32 0 0 1 0 -32Z" fill="#ffe6a6"/><text x="0" y="53" font-size="17" fill="#d1deea" text-anchor="middle" font-weight="normal">8</text><text x="0" y="77" font-size="14" fill="#f1f5fb" text-anchor="middle" font-weight="bold">그믐달</text></g><text x="400" y="811" font-size="16" fill="#c1d3e3" text-anchor="middle" font-weight="normal">달의 밝은 모양과 기울기는 관찰 장소와 시간에 따라 조금 달라 보여요.</text></svg>