<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#287aa0"/></marker></defs><rect width="960" height="720" rx="22" fill="#f3f8fc"/><text x="35" y="54" font-size="36" fill="#243b53" font-weight="bold" text-anchor="start">달은 왜 빛날까요?</text><text x="36" y="92" font-size="23" fill="#243b53" font-weight="normal" text-anchor="start">태양빛의 반사와 관찰 방향 · 모식도 (크기와 거리 비례 아님)</text><circle cx="115" cy="225" r="60" fill="#f4b942"/><text x="115" y="310" font-size="26" fill="#243b53" font-weight="normal" text-anchor="middle">태양</text><circle cx="500" cy="470" r="52" fill="#397fb6"/><text x="500" y="550" font-size="26" fill="#243b53" font-weight="normal" text-anchor="middle">지구</text><circle cx="500" cy="225" r="63" fill="#35465d"/><path d="M500 162 A63 63 0 0 0 500 288Z" fill="#f6dd91"/><text x="600" y="230" font-size="26" fill="#243b53" font-weight="normal" text-anchor="start">달</text><path d="M190 185 L430 185" stroke="#e8a62b" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M190 225 L430 225" stroke="#e8a62b" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M190 265 L430 265" stroke="#e8a62b" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M461 273 L480 414" stroke="#287aa0" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="250" y="370" font-size="24" fill="#243b53" font-weight="normal" text-anchor="start">반사된 태양빛</text><text x="600" y="450" font-size="24" fill="#243b53" font-weight="normal" text-anchor="start">지구에서 본 반달</text><circle cx="765" cy="515" r="45" fill="#35465d"/><path d="M765 470 A45 45 0 0 1 765 560Z" fill="#f6dd91"/><text x="40" y="615" font-size="25" fill="#243b53" font-weight="bold" text-anchor="start">달은 스스로 빛을 내지 않고 태양빛을 반사합니다.</text><text x="40" y="655" font-size="24" fill="#243b53" font-weight="normal" text-anchor="start">위상은 태양·지구·달의 상대적 위치에 따라 달라집니다.</text></svg>