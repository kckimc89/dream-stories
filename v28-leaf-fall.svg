<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#287aa0"/></marker></defs><rect width="960" height="720" rx="22" fill="#f3f8fc"/><text x="35" y="54" font-size="36" fill="#243b53" font-weight="bold" text-anchor="start">나무는 어떻게 겨울을 준비할까요?</text><text x="36" y="92" font-size="23" fill="#243b53" font-weight="normal" text-anchor="start">잎자루 밑의 떨켜(이층)와 낙엽</text><rect x="35" y="135" width="280" height="390" rx="14" fill="#e6edf2"/><text x="175" y="175" font-size="28" fill="#243b53" font-weight="bold" text-anchor="middle">여름</text><rect x="80" y="210" width="42" height="220" rx="14" fill="#a27451"/><path d="M120 300 L220 255" stroke="#926340" stroke-width="13" fill="none"/><path d="M220 255 Q175 180 280 200 Q295 275 220 255Z" fill="#4c985e"/><text x="175" y="485" font-size="19" fill="#243b53" font-weight="normal" text-anchor="middle">물질 이동 활발</text><rect x="345" y="135" width="280" height="390" rx="14" fill="#e6edf2"/><text x="485" y="175" font-size="28" fill="#243b53" font-weight="bold" text-anchor="middle">가을</text><rect x="390" y="210" width="42" height="220" rx="14" fill="#a27451"/><path d="M430 300 L530 255" stroke="#926340" stroke-width="13" fill="none"/><path d="M530 255 Q485 180 590 200 Q605 275 530 255Z" fill="#d97c42"/><rect x="433" y="284" width="15" height="35" rx="14" fill="#f4cc72"/><text x="455" y="345" font-size="22" fill="#243b53" font-weight="normal" text-anchor="start">떨켜</text><text x="485" y="485" font-size="19" fill="#243b53" font-weight="normal" text-anchor="middle">양분 회수와 떨켜 발달</text><rect x="655" y="135" width="280" height="390" rx="14" fill="#e6edf2"/><text x="795" y="175" font-size="28" fill="#243b53" font-weight="bold" text-anchor="middle">낙엽</text><rect x="700" y="210" width="42" height="220" rx="14" fill="#a27451"/><path d="M740 300 L840 255" stroke="#926340" stroke-width="13" fill="none"/><path d="M845 405 Q785 340 900 350 Q915 425 845 405Z" fill="#b9804b"/><rect x="743" y="284" width="15" height="35" rx="14" fill="#f4cc72"/><text x="765" y="345" font-size="22" fill="#243b53" font-weight="normal" text-anchor="start">떨켜</text><text x="795" y="485" font-size="19" fill="#243b53" font-weight="normal" text-anchor="middle">잎이 떨어지고 보호층이 남음</text><text x="40" y="585" font-size="26" fill="#243b53" font-weight="bold" text-anchor="start">잎자루 밑에서 떨켜가 발달하고 잎이 분리됩니다.</text><text x="40" y="630" font-size="23" fill="#243b53" font-weight="normal" text-anchor="start">양분 회수와 색소 변화, 떨켜 발달은 일부 동시에 진행됩니다.</text></svg>