<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="665" viewBox="0 0 1000 665" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1000" height="665" rx="0" fill="#f6f4e9" stroke="none" stroke-width="2"/><rect x="24" y="24" width="952" height="94" rx="18" fill="#163e58" stroke="none" stroke-width="2"/><text x="48" y="66" font-size="36" fill="white" font-weight="700" text-anchor="start">우리 몸의 면역 방어</text><text x="48" y="98" font-size="20" fill="#d6e9ef" font-weight="400" text-anchor="start">상처와 감염에 대응하는 과정 · 서로 겹쳐 진행돼요</text><rect x="40" y="145" width="450" height="225" rx="18" fill="#e2edf3" stroke="none" stroke-width="2"/><text x="62" y="182" font-size="27" fill="#174e69" font-weight="700" text-anchor="start">1. 피부 장벽이 손상돼요</text><text x="62" y="221" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">세균이 들어올 수 있어요.</text><text x="62" y="253" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">혈소판과 응고 인자가 지혈해요.</text><path d="M490 260 L505 260" stroke="#33809c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="505" y="145" width="450" height="225" rx="18" fill="#e2edf3" stroke="none" stroke-width="2"/><text x="527" y="182" font-size="27" fill="#174e69" font-weight="700" text-anchor="start">2. 백혈구가 모여요</text><text x="527" y="221" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">염증 신호를 따라 혈관 밖으로 이동.</text><text x="527" y="253" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">호중구와 대식세포가 세균을 포식해요.</text><rect x="40" y="395" width="450" height="225" rx="18" fill="#e2edf3" stroke="none" stroke-width="2"/><text x="62" y="432" font-size="27" fill="#174e69" font-weight="700" text-anchor="start">3. 맞춤형 면역이 작동해요</text><text x="62" y="471" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">B세포는 항체를 만드는 세포로 분화.</text><text x="62" y="503" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">T세포는 면역 조절과 감염 세포 제거.</text><path d="M490 510 L505 510" stroke="#33809c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="505" y="395" width="450" height="225" rx="18" fill="#e2edf3" stroke="none" stroke-width="2"/><text x="527" y="432" font-size="27" fill="#174e69" font-weight="700" text-anchor="start">4. 회복하고 기억해요</text><text x="527" y="471" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">조직이 회복되고 염증이 줄어요.</text><text x="527" y="503" font-size="23" fill="#17334b" font-weight="400" text-anchor="start">일부 B·T세포는 기억세포로 남아요.</text></svg>